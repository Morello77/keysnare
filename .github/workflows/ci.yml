name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy
      - run: pytest --cov

  # Disposable runner only: creates a local user and changes the audit policy and a scheduled task.
  # See tests/integration/trap_harness.ps1 and docs/design-traps.md, "Testing".
  trap-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install KeySnare where the test user can run it
        shell: pwsh
        run: |
          python -m venv C:\ks-venv
          C:\ks-venv\Scripts\python.exe -m pip install .
      - name: Trap install -> test -> remove as a standard user
        shell: powershell
        run: tests\integration\trap_harness.ps1 -KeySnare C:\ks-venv\Scripts\keysnare.exe
